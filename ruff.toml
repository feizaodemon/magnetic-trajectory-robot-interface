# Lint settings for CI. The robot runtime is ROS Noetic on Python 3.8.
target-version = "py38"

[lint]
# Ruff's default rules plus FA102, which flags annotations that only run on
# Python 3.8 with `from __future__ import annotations`.
extend-select = ["FA102"]
# Nodes, scripts and tests put package paths on sys.path before importing.
ignore = ["E402"]

[lint.per-file-ignores]
# FR3 operator tooling is hardware scope; changes there need separate review.
# Known findings, not fixed yet:
# - fr3_lab_runtime.py imports argparse, getpass and sys without using them.
# - fr3_lab_operator.py calls _string_tuple without importing it.
"scripts/fr3_lab_runtime.py" = ["F401"]
"scripts/fr3_lab_operator.py" = ["F821"]
