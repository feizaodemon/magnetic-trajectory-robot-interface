# Lint settings for CI. The robot runtime is ROS Noetic on Python 3.8.
target-version = "py38"

[lint]
# Ruff's default rules plus FA102, which flags annotations that only run on
# Python 3.8 with `from __future__ import annotations`.
extend-select = ["FA102"]
# Nodes, scripts and tests put package paths on sys.path before importing.
ignore = ["E402"]
