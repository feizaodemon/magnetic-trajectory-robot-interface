name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Boost headers
        # C++ tests compile fr3_hardware_safety.cpp, which includes Boost.UUID.
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install dependencies
        # Tests import yaml, which requirements.txt does not list yet.
        run: pip install -r requirements.txt PyYAML
      - name: Run pytest
        # These two files import rospy, actionlib and ROS message packages,
        # which only exist in a ROS Noetic environment.
        run: >-
          python -m pytest -q
          --ignore=tests/test_fr3_gazebo_visible_task_bridge_node.py
          --ignore=tests/test_raw_packet_to_trajectory_2d_node.py
