name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Boost headers
        # C++ tests compile fr3_hardware_safety.cpp, which includes Boost.UUID.
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        # Tests that need ROS Noetic packages skip themselves here.
        run: python -m pytest -q -rs
