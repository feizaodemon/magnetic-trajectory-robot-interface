name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Boost headers
        # C++ tests compile fr3_hardware_safety.cpp, which includes Boost.UUID.
        run: sudo apt-get update && sudo apt-get install -y libboost-dev
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        # Tests that need ROS Noetic packages skip themselves here.
        run: python -m pytest -q -rs

  ruff:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff
        # Settings live in ruff.toml.
        run: ruff check --output-format=github .

  dtw-eval:
    # Leave-one-out evaluation of the tracked DTW bank: the numbers in the
    # README. Fails if Top-1 accuracy drops below 95%. Latency depends on the
    # runner and is reported only.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Leave-one-out evaluation
        run: |
          python scripts/eval_dtw_bank_loo.py --min-top1 0.95 \
            --json-out outputs/dtw_eval/loo.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: dtw-loo-eval
          path: outputs/dtw_eval/loo.json

  pytest-noetic:
    # The robot runtime: ROS Noetic on Python 3.8, with the real rospy and
    # message packages, so the ROS-only tests run instead of skipping.
    runs-on: ubuntu-22.04
    container: ros:noetic-ros-base
    steps:
      - name: Install system packages
        # git comes before checkout so it makes a real clone; some tests run
        # git. control_msgs is the one message package ros-base lacks.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-pip libboost-dev ros-noetic-control-msgs
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run pytest
        shell: bash
        run: |
          # The container runs as root; the checkout belongs to the runner user.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source /opt/ros/noetic/setup.bash
          python3 -m pytest -q -rs
      - name: Parse launch files
        # --dump-params and --nodes only parse a launch file: they start no
        # node and need no ROS master. ros-base lacks franka_gazebo (Gazebo
        # launches) and franka_control (FR3 hardware launches, which also need
        # a robot_ip), so only the launches that parse without them are listed.
        shell: bash
        run: |
          source /opt/ros/noetic/setup.bash
          export ROS_PACKAGE_PATH="$GITHUB_WORKSPACE/colmag_ros:$GITHUB_WORKSPACE/colmag_gazebo_stub:$ROS_PACKAGE_PATH"
          for launch in \
            dtw_mouse_demo_frontend.launch \
            dtw_real_board_demo_frontend.launch \
            dtw_template_bank_recognizer.launch \
            colmag_8symbol_recognition_display.launch \
            colmag_fr3_task_trajectory_adapter.launch \
            colmag_mouse_fr3_adapter_dry_run.launch \
            colmag_real_board_fr3_adapter_dry_run.launch \
            colmag_real_board_fr3_cartesian_teleop.launch; do
            echo "== $launch"
            roslaunch --dump-params colmag_ros "$launch" > /dev/null
            roslaunch --nodes colmag_ros "$launch"
          done

  catkin-build:
    # Compiles and installs both ROS packages, including the FR3 C++ adapters.
    # Build only: it starts no node, launch file, controller or robot.
    runs-on: ubuntu-22.04
    container: ros:noetic-ros-base
    steps:
      - name: Install build dependencies
        # ros-base lacks urdf and control_msgs. franka_ros is only an exec
        # dependency, so the build does not need it.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libboost-dev ros-noetic-control-msgs ros-noetic-urdf
      - uses: actions/checkout@v7
      - name: catkin_make install
        shell: bash
        run: |
          mkdir -p /catkin_ws/src
          cp -r colmag_ros colmag_gazebo_stub /catkin_ws/src/
          cd /catkin_ws
          source /opt/ros/noetic/setup.bash
          catkin_make install -DCMAKE_BUILD_TYPE=Release
      - name: Check installed artifacts
        shell: bash
        run: |
          cd /catkin_ws
          source install/setup.bash
          test -x install/lib/colmag_ros/colmag_fr3_task_trajectory_adapter
          test -x install/lib/colmag_ros/colmag_fr3_cartesian_teleop_adapter
          python3 -c "import colmag_ros.execution_semantics, colmag_gazebo_stub"

  gazebo-smoke:
    # Builds the Gazebo image and runs the keyboard TELEOP profile with
    # headless Gazebo: mode gating, Cartesian motion and the gripper bridge.
    # Gazebo only: no FR3 launch, controller or hardware.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Build Gazebo image
        run: |
          docker build -f docker/Dockerfile.noetic-gazebo \
            --build-arg COLMAG_GIT_SHA="$GITHUB_SHA" -t colmag-gazebo-smoke .
      - name: Run Gazebo smoke test
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/scripts/ci:/ci:ro" \
            colmag-gazebo-smoke bash /ci/gazebo_smoke.sh
