colmag_fr3_task_trajectory_adapter:
  command_topic: "/colmag/task_command"
  state_topic: "/colmag/fr3_task_trajectory_adapter_state"
  adapter_session_topic: "/colmag/fr3_adapter_session"
  controller_name: "position_joint_trajectory_controller"
  follow_joint_trajectory_action: "/position_joint_trajectory_controller/follow_joint_trajectory"
  controller_joint_names_param: "/position_joint_trajectory_controller/joints"
  joint_state_topic: "/franka_state_controller/joint_states"
  robot_description_param: "/robot_description"
  arm_id: "fr3"
  # joint_names and target_joint_name are derived from arm_id by the launch
  # contract; the visible-motion profile selects $(arg arm_id)_joint1.

  # Default route is no-motion. Hardware execution requires all three explicit
  # gates: send_goals=true, hardware_execution_enabled=true, and
  # hardware_profile=fr3-hardware-active.
  send_goals: false
  hardware_execution_enabled: false
  hardware_profile: "dry-run"
  require_confirmed: true
  require_accepted: true
  reject_gazebo_only_commands: true
  reject_controls_real_robot_true: true

  joint_state_max_age_sec: 0.5
  joint_state_future_tolerance_sec: 0.05
  joint_nudge_delta_rad: 0.10
  max_abs_joint_delta_rad: 0.12
  goal_duration_sec: 3.0
  trajectory_start_delay_sec: 0.2
  max_velocity_rad_s: 0.12
  max_acceleration_rad_s2: 0.18
  sample_period_sec: 0.10
  hexagon_primary_offset_rad: 0.08
  hexagon_secondary_offset_rad: 0.10
  hexagon_minimum_edge_duration_sec: 1.0
  joint_limit_margin_rad: 0.02
  action_server_wait_sec: 0.5
  execution_timeout_sec: 15.0
  final_state_timeout_sec: 1.0
  watchdog_period_sec: 0.05
  final_joint_error_tolerance_rad: 0.01

  one_shot_hardware_mode: true
  # 0 is unlimited sequential attempts; 1 is one-shot; N > 1 is bounded.
  # Negative values are rejected before ROS wiring starts.
  max_motion_goals_per_process: 1
  command_max_age_sec: 2.0
  command_future_tolerance_sec: 0.1
  recent_command_cache_size: 128
  supported_schema_version: 1
  allowed_tasks:
    - MOVE_LEFT
    - HEXAGON_TRAJECTORY
    - MOVE_RIGHT
    - STOP_OR_CANCEL

  # Hard upper bounds enforced at startup:
  # action wait 5s; execution 30s; final verification 5s; trajectory start 2s;
  # joint-state age 2s; command age 10s; steady watchdog period 1s.
