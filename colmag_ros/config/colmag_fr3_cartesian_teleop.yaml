# Algorithm defaults adapted from the existing Cartesian teleoperation
# implementation. Real-board mapping values require on-site calibration before
# calibration_valid may be enabled.
input_x_min: -0.05
input_x_max: 0.05
input_y_min: -0.05
input_y_max: 0.05
input_z_min: 0.007
input_z_max: 0.150
swap_xy: true
map_x_sign: -1.0
map_y_sign: 1.0
map_z: true
height_gain: 2.0

workspace_min: [0.30, -0.30, 0.121]
workspace_max: [0.60, 0.30, 0.680]
target_smoothing_tau_sec: 0.08
max_linear_speed_m_s: 0.10
max_linear_acceleration_m_s2: 0.20
max_linear_jerk_m_s3: 0.80
s_curve_min_duration_sec: 0.75

ik_max_iterations: 60
dls_damping: 0.03
jacobian_epsilon: 0.000001
ik_position_tolerance_m: 0.005
ik_orientation_tolerance_rad: 0.02
ik_position_step_limit_m: 0.02
ik_orientation_step_limit_rad: 0.05
max_joint_step_rad: 0.05
joint_velocity_filter_alpha: 0.5
joint_limit_margin_rad: 0.02

# Conservative Panda/FR3 intersection used by the existing Cartesian logic.
joint_lower: [-2.7437, -1.7628, -2.8973, -3.0421, -2.8065, 0.5445, -2.8973]
joint_upper: [2.7437, 1.7628, 2.8973, -0.1518, 2.8065, 3.7525, 2.8973]

input_freshness_timeout_sec: 0.25
joint_state_freshness_timeout_sec: 0.25
joint_state_future_tolerance_sec: 0.05
command_period_sec: 0.0333333333
command_time_from_start_sec: 0.10
