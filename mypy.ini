# Type checks for the core ROS-free modules. The robot runtime is ROS Noetic
# on Python 3.8. Run `mypy` from the repo root; CI pins mypy==1.14.1.
[mypy]
python_version = 3.8
mypy_path = colmag_ros/src:src
files =
    colmag_ros/src/colmag_ros/param_utils.py,
    colmag_ros/src/colmag_ros/control_mode.py,
    colmag_ros/src/colmag_ros/recognition_uncertainty.py,
    colmag_ros/src/colmag_ros/symbol_semantics.py,
    colmag_ros/src/colmag_ros/trajectory_strokes.py,
    colmag_ros/src/colmag_ros/trajectory_rasterizer.py,
    colmag_ros/src/colmag_ros/dashboard_trajectory_processing.py,
    colmag_ros/src/colmag_ros/dtw_bank_features.py,
    colmag_ros/src/colmag_ros/dtw_dataset_io.py,
    colmag_ros/src/colmag_ros/dtw_template_bank_tools.py,
    colmag_ros/src/colmag_ros/preview_recognition.py,
    colmag_ros/src/colmag_ros/gesture_recognizers.py,
    colmag_ros/src/colmag_ros/recognition_benchmark.py
explicit_package_bases = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
# Other modules these import are read for types but not reported on.
follow_imports = silent

[mypy-colmag_ros.param_utils,colmag_ros.control_mode,colmag_ros.recognition_uncertainty,colmag_ros.symbol_semantics,colmag_ros.trajectory_strokes,colmag_ros.trajectory_rasterizer,colmag_ros.dashboard_trajectory_processing,colmag_ros.dtw_bank_features,colmag_ros.dtw_dataset_io,colmag_ros.dtw_template_bank_tools,colmag_ros.preview_recognition,colmag_ros.gesture_recognizers,colmag_ros.recognition_benchmark]
disallow_untyped_defs = True
disallow_incomplete_defs = True
